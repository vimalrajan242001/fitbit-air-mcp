name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes the older run; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    # Mark both "Unit tests (Node 22)" and "Unit tests (Node 24)" as required checks in branch protection.
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run unit tests with coverage
        # An explicit `shell: bash` adds pipefail, so a failing test still fails this step through tee.
        shell: bash
        run: npm test -- --test-reporter=spec --experimental-test-coverage --test-coverage-include='src/**' 2>&1 | tee test-output.txt
      - name: Test summary
        if: always()
        run: |
          {
            echo "## Unit tests (Node ${{ matrix.node }})"
            echo '```'
            grep -E '^ℹ' test-output.txt || echo 'No test summary was produced. See the step log.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Typecheck, build, and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests run in their own job above.
      - run: npm run typecheck
      - run: npm run build
      - name: bundle worker
        run: npx wrangler deploy --dry-run --outdir dist-worker
      - run: node scripts/secret-scan.mjs
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [unit-tests, check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: smoke test
        id: smoke
        run: |
          url=$(sed -n 's/^PUBLIC_URL = "\(.*\)"/\1/p' wrangler.toml)
          meta=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$url/.well-known/oauth-authorization-server")
          mcp=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$url/mcp")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "meta=$meta" >> "$GITHUB_OUTPUT"
          echo "mcp=$mcp" >> "$GITHUB_OUTPUT"
          test "$meta" = 200 && test "$mcp" = 401
      - name: status summary
        if: always()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "## Deploy ${{ job.status }}"
            echo "- Commit: \`${GITHUB_SHA::7}\` $(echo "$COMMIT_MSG" | head -1)"
            echo "- Worker: ${{ steps.smoke.outputs.url }}"
            echo "- OAuth metadata: ${{ steps.smoke.outputs.meta || 'not run' }} (want 200)"
            echo "- /mcp without token: ${{ steps.smoke.outputs.mcp || 'not run' }} (want 401)"
          } >> "$GITHUB_STEP_SUMMARY"
