name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: bundle worker
        run: npx wrangler deploy --dry-run --outdir dist-worker
      - run: node scripts/secret-scan.mjs
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: smoke test
        id: smoke
        run: |
          url=$(sed -n 's/^PUBLIC_URL = "\(.*\)"/\1/p' wrangler.toml)
          meta=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$url/.well-known/oauth-authorization-server")
          mcp=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$url/mcp")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "meta=$meta" >> "$GITHUB_OUTPUT"
          echo "mcp=$mcp" >> "$GITHUB_OUTPUT"
          test "$meta" = 200 && test "$mcp" = 401
      - name: status summary
        if: always()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "## Deploy ${{ job.status }}"
            echo "- Commit: \`${GITHUB_SHA::7}\` $(echo "$COMMIT_MSG" | head -1)"
            echo "- Worker: ${{ steps.smoke.outputs.url }}"
            echo "- OAuth metadata: ${{ steps.smoke.outputs.meta || 'not run' }} (want 200)"
            echo "- /mcp without token: ${{ steps.smoke.outputs.mcp || 'not run' }} (want 401)"
          } >> "$GITHUB_STEP_SUMMARY"
